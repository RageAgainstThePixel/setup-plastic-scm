name: validate
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: ./ # RageAgainstThePixel/setup-plastic-scm@v2
        id: setup-plastic-scm
      - run: |
          cm version
          echo "path: ${{ steps.setup-plastic-scm.outputs.path }}"
          echo "version: ${{ steps.setup-plastic-scm.outputs.version }}"
          "$PLASTIC_SCM_PATH" version
        shell: bash
