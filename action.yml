name: setup-plastic-scm
description: 'A GitHub action to setup and install Plastic SCM (Unity VCS)'
branding:
  icon: 'database'
  color: 'blue'
inputs:
  version:
    description: 'The version of Plastic SCM to install, for example 11.0.16.9156'
    required: false
    default: 'latest'
outputs:
  path:
    description: 'The full path to the cm executable.'
  version:
    description: 'The installed Plastic SCM version.'
runs:
  using: 'node24'
  main: 'dist/index.js'
