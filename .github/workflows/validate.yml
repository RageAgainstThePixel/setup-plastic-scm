name: validate
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    # docs-only pull requests skip validation; validate-result still reports for them
    uses: RageAgainstThePixel/workflows/.github/workflows/detect-changes.yml@main
  validate:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: [latest, 11.0.16.10484]
    steps:
      - uses: actions/checkout@v6
      - uses: ./ # RageAgainstThePixel/setup-plastic-scm@v2
        id: setup-plastic-scm
        with:
          version: ${{ matrix.version }}
      - run: |
          cm version
          echo "path: ${{ steps.setup-plastic-scm.outputs.path }}"
          echo "version: ${{ steps.setup-plastic-scm.outputs.version }}"
          "$PLASTIC_SCM_PATH" version
        shell: bash
  # the one required check: passes when every job passed or was skipped for a docs-only change
  validate-result:
    needs: [changes, validate]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
